services:
  - type: web
    name: ashare-ontology-agent
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-chat
      - key: LLM_ENABLED
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://beiluo.github.io,http://localhost:8000,http://127.0.0.1:8000
      - key: TRUST_PROXY
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "6"
      - key: RATE_LIMIT_PER_HOUR
        value: "40"
      - key: DAILY_REQUEST_BUDGET
        value: "300"
      - key: SERVE_STATIC
        value: "true"
